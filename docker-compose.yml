name: hackhaton

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run scripts/init_env.py}
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/init_env.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy

  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run scripts/init_env.py}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/init_env.py}
    volumes:
      - miniodata:/data
    ports:
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'

  storage-init:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      S3_ENDPOINT_URL: http://minio:9000
    command: [python, -m, app.storage_bootstrap]
    depends_on:
      minio:
        condition: service_started

  api:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12

volumes:
  pgdata:
  miniodata:
