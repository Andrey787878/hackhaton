name: PostgreSQL database

on:
  push:
    branches: [dev, 'database/**']
    paths-ignore: ['docs/**', 'scripts/build_database_report.py', 'requirements-report.txt']
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: hackhaton-db-ci
      COMPOSE_FILE: docker-compose.yml:compose.test.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create isolated configuration
        run: |
          python scripts/init_env.py
          mkdir -p verification
      - name: Start the project with PostgreSQL 17 and MinIO
        run: docker compose up --build -d --wait --wait-timeout 240 api
      - name: Migration console
        run: |
          docker compose logs --no-color migrate | tee verification/migrations.txt
          docker compose exec -T api python -m alembic current
          docker compose exec -T api python -m alembic check
      - name: Verify schema and commit/read/rollback
        run: docker compose exec -T api python -m scripts.verify_database --exercise | tee verification/database.json
      - name: Full integration suite in Docker
        run: docker compose run --build --rm test | tee verification/tests.txt
      - name: Snapshot populated tables
        run: docker compose exec -T api python -m scripts.database_snapshot | tee verification/tables.json
      - name: Verify persistence after PostgreSQL container restart
        run: |
          docker compose restart db
          docker compose up -d --wait --wait-timeout 120 api
          docker compose exec -T api python -m scripts.database_snapshot > verification/tables-after-restart.json
          diff verification/tables.json verification/tables-after-restart.json
          docker compose exec -T api python -m scripts.verify_database
      - name: Save Docker verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-docker-verification
          path: verification/
      - name: Stop isolated test project
        if: always()
        run: docker compose down -v
