# Run with a separate project name so the application DB is never used.
services:
  minio:
    ports: !reset []

  test:
    build:
      context: .
      target: test
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
